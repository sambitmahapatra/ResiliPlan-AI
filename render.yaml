# Render blueprint for the ResiliPlan solver API (Path A: API on a Python host).
# Import this repo at https://render.com → New → Blueprint. Deploys from the repo ROOT
# (the API reads src/, data/clean, data/assumptions, data/scenarios, results/).
services:
  - type: web
    name: resiliplan-api
    runtime: python
    plan: free
    buildCommand: "pip install -r app/api/requirements.txt"
    startCommand: "uvicorn app.api.index:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL          # set in the Render dashboard (secret)
        sync: false
      - key: SUPABASE_SERVICE_KEY  # set in the Render dashboard (secret)
        sync: false
      - key: ALLOWED_ORIGINS       # e.g. https://resiliplan-ai.vercel.app
        sync: false
